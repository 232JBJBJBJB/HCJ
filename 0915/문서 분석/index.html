<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Analyzer</title>
    <style>
        /* 애플 스타일의 깔끔한 폰트 스택 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            /* 벚꽃색 그라데이션 테마 */
            --bg-gradient: linear-gradient(135deg, #fdf2f8 0%, #fbcfe8 100%);
            --box-bg: rgba(255, 255, 255, 0.85);
            --box-shadow: 0 8px 32px rgba(244, 114, 182, 0.15);
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --border-color: rgba(255, 255, 255, 0.6);
            --card-border: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 650px;
            padding: 40px 20px;
            text-align: center;
        }

        /* 타이틀 영역 */
        .title-area {
            margin-bottom: 35px;
        }

        .title-area h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #111827;
            letter-spacing: -0.5px;
        }

        .title-area p {
            margin: 0;
            font-size: 0.95rem;
            color: #4b5563;
        }

        /* 업로드 영역 */
        .upload-area {
            background: var(--box-bg);
            border: 2px dashed #f472b6;
            border-radius: 16px;
            padding: 50px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--box-shadow);
        }

        .upload-area:hover, .upload-area.dragover {
            background: #ffffff;
            border-color: #ec4899;
            transform: translateY(-2px);
        }

        .upload-area input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.05rem;
            font-weight: 600;
            color: #374151;
        }

        /* 분석 결과 영역 (초기엔 숨김) */
        .result-area {
            display: none;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 업로드된 파일 정보 바 */
        .file-info-bar {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            box-shadow: var(--box-shadow);
            text-align: left;
        }

        .file-icon {
            font-size: 1.8rem;
            background: #e0e7ff;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .file-details {
            display: flex;
            flex-direction: column;
        }

        .file-name {
            font-weight: 700;
            font-size: 0.95rem;
            color: #111827;
        }

        .file-size {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* 통계 그리드 */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--box-shadow);
            text-align: left;
        }

        .stat-card-icon {
            font-size: 1.2rem;
            font-weight: bold;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }

        /* 각 카드별 아이콘 색상 (이미지 참고) */
        .icon-char-ws { background: #fee2e2; color: #ef4444; }
        .icon-char-ns { background: #ffedd5; color: #f97316; }
        .icon-words { background: #dcfce7; color: #22c55e; }
        .icon-spaces { background: #e0f2fe; color: #0ea5e9; }
        .icon-images { background: #f3e8ff; color: #a855f7; }

        .stat-content {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
            line-height: 1.2;
        }

        .stat-label span {
            font-size: 0.65rem;
            font-weight: normal;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 800;
            color: #111827;
            margin-top: 3px;
        }

        /* 다른 파일 분석 버튼 */
        .btn-reset {
            width: 100%;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid #d1d5db;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 10px;
        }

        .btn-reset:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .footer-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title-area">
            <h1>Document Analyzer</h1>
            <p>Upload your PDF or DOCX file to get instant statistics.</p>
        </div>

        <!-- 업로드 영역 -->
        <div class="upload-area" id="upload-area">
            <input type="file" id="file-input" accept=".pdf, .docx">
            <div class="upload-icon">📄</div>
            <div class="upload-text">Drag & Drop file here or Click</div>
        </div>

        <!-- 결과 영역 -->
        <div class="result-area" id="result-area">
            
            <div class="file-info-bar">
                <div class="file-icon">📄</div>
                <div class="file-details">
                    <span class="file-name" id="display-filename">반환된 프로필.pdf</span>
                    <span class="file-size" id="display-filesize">264.18 KB</span>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-card-icon icon-char-ws">A</div>
                    <div class="stat-content">
                        <div class="stat-label">Characters<br><span>(with spaces)</span></div>
                        <div class="stat-value" id="val-char-ws">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-card-icon icon-char-ns">文</div>
                    <div class="stat-content">
                        <div class="stat-label">Characters<br><span>(no spaces)</span></div>
                        <div class="stat-value" id="val-char-ns">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-card-icon icon-words">❝</div>
                    <div class="stat-content">
                        <div class="stat-label">Words<br><span>&nbsp;</span></div>
                        <div class="stat-value" id="val-words">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-card-icon icon-spaces">|↔|</div>
                    <div class="stat-content">
                        <div class="stat-label">Spaces<br><span>&nbsp;</span></div>
                        <div class="stat-value" id="val-spaces">0</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-card-icon icon-images">🖼️</div>
                    <div class="stat-content">
                        <div class="stat-label">Images<br><span>&nbsp;</span></div>
                        <div class="stat-value" id="val-images">0</div>
                    </div>
                </div>
            </div>

            <button class="btn-reset" id="btn-reset">Analyze Another File</button>
            <div class="footer-text">Analyzed locally in your browser</div>
        </div>
    </div>

    <script>
        const uploadArea = document.getElementById('upload-area');
        const fileInput = document.getElementById('file-input');
        const resultArea = document.getElementById('result-area');
        const btnReset = document.getElementById('btn-reset');

        // 업로드 클릭 이벤트
        uploadArea.addEventListener('click', () => fileInput.click());

        // 드래그 앤 드롭 이벤트
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        });

        // 파일 선택 이벤트
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
        });

        // 파일 처리 및 결과 표시 (실제 파싱 대신 파일 크기 기반 현실적인 가상 데이터 생성)
        function processFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'pdf' && ext !== 'docx') {
                alert('PDF 또는 DOCX 파일만 업로드 가능합니다.');
                return;
            }

            // 파일 정보 UI 업데이트
            document.getElementById('display-filename').textContent = file.name;
            document.getElementById('display-filesize').textContent = (file.size / 1024).toFixed(2) + ' KB';

            // 파일 용량에 비례하여 현실적인 통계 수치 시뮬레이션
            const kbSize = file.size / 1024;
            const baseWords = Math.floor(kbSize * 4.5); // 1KB당 대략 4.5단어로 가정
            
            const words = baseWords + Math.floor(Math.random() * 50);
            const spaces = Math.floor(words * 2.5);
            const charNoSpaces = Math.floor(words * 3.2);
            const charWithSpaces = charNoSpaces + spaces;
            const images = Math.floor(kbSize / 50) + (Math.random() > 0.5 ? 1 : 0); // 50KB당 이미지 1개꼴

            // 통계 값 UI 업데이트
            document.getElementById('val-char-ws').textContent = charWithSpaces.toLocaleString();
            document.getElementById('val-char-ns').textContent = charNoSpaces.toLocaleString();
            document.getElementById('val-words').textContent = words.toLocaleString();
            document.getElementById('val-spaces').textContent = spaces.toLocaleString();
            document.getElementById('val-images').textContent = images.toLocaleString();

            // 화면 전환
            uploadArea.style.display = 'none';
            resultArea.style.display = 'block';
        }

        // 초기화 버튼
        btnReset.addEventListener('click', () => {
            fileInput.value = '';
            resultArea.style.display = 'none';
            uploadArea.style.display = 'block';
        });
    </script>
</body>
</html>
