<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Been - Away Notifier</title>
    <style>
        /* 애플 스타일의 깔끔한 폰트 스택 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            /* 설정 화면용 연한 보라색 배경 */
            --bg-light: #faf5ff;
            --box-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1d1d1f;
            --text-muted: #6b7280;
            --primary-color: #9333ea;
            --primary-hover: #7e22ce;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            color: var(--text-main);
            overflow: hidden; /* 알림 화면 시 스크롤 방지 */
        }

        /* 공통 화면 컨테이너 */
        .screen {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            transition: opacity 0.5s ease;
        }

        .hidden {
            display: none !important;
        }

        /* ================= 설정 화면 (Setup Screen) ================= */
        #setup-screen {
            background-color: var(--bg-light);
            align-items: center;
        }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
        }

        .header-left {
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--primary-color);
        }

        .header-right {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-container {
            width: 100%;
            max-width: 480px;
            margin: auto;
            background: var(--box-bg);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(147, 51, 234, 0.1);
            border: 1px solid rgba(147, 51, 234, 0.1);
        }

        .form-container h2 {
            text-align: center;
            font-size: 1.8rem;
            margin: 0 0 5px 0;
            color: #111827;
        }

        .form-container p {
            text-align: center;
            color: var(--text-muted);
            margin: 0 0 30px 0;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #374151;
        }

        .form-control {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
            background: #f9fafb;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            background: #ffffff;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.1);
        }

        .btn-submit {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--primary-hover);
        }

        /* ================= 부재 중 알림 화면 (Display Screen) ================= */
        /* 그라데이션 애니메이션 정의 */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #display-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            /* 보라색 그라데이션 애니메이션 배경 */
            background: linear-gradient(-45deg, #4c1d95, #7e22ce, #a855f7, #c084fc);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .display-content {
            background: rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 60px 80px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }

        #out-reason {
            font-size: 4.5rem;
            font-weight: 800;
            margin: 0 0 10px 0;
            letter-spacing: -1px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        #out-time {
            font-size: 1.5rem;
            font-weight: 500;
            margin: 0 0 20px 0;
            color: #e9d5ff;
        }

        #out-countdown {
            font-size: 3.5rem;
            font-weight: 700;
            margin: 0 0 30px 0;
            font-variant-numeric: tabular-nums; /* 숫자가 흔들리지 않게 고정 폭 설정 */
        }

        #out-message {
            font-size: 1.2rem;
            font-weight: 400;
            margin: 0;
            color: #d8b4fe;
        }

        /* 더블클릭 시 복귀 안내용 */
        .exit-hint {
            position: absolute;
            bottom: 20px;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <!-- 설정 화면 -->
    <div id="setup-screen" class="screen">
        <header>
            <div class="header-left">Been</div>
            <div class="header-right">Away Notifier</div>
        </header>

        <div class="form-container">
            <h2>부재 중 알리미</h2>
            <p>잠시 자리를 비울 때 화면에 띄워두세요.</p>

            <div class="form-group">
                <label for="input-reason">일정 (행선지)</label>
                <input type="text" id="input-reason" class="form-control" placeholder="예: 화상미팅 다녀올게요">
            </div>

            <div class="form-group">
                <label for="input-time">복귀 예정 시간</label>
                <input type="time" id="input-time" class="form-control" required>
            </div>

            <div class="form-group">
                <label for="input-message">기타 안내 문구</label>
                <input type="text" id="input-message" class="form-control" placeholder="예: 급한 일은 슬랙 남겨주세요">
            </div>

            <button class="btn-submit" id="btn-start">알림 화면 시작</button>
        </div>
    </div>

    <!-- 부재 중 알림 화면 -->
    <div id="display-screen" class="screen hidden">
        <div class="display-content">
            <!-- 일정을 제일 큰 글자로 출력 -->
            <h1 id="out-reason">화상미팅 다녀올게요</h1>
            <h2 id="out-time">Back at 10:30</h2>
            <div id="out-countdown">00m 00s</div>
            <p id="out-message">급한 일은 슬랙 남겨주세요</p>
        </div>
        <div class="exit-hint">화면을 더블 클릭하면 설정으로 돌아갑니다.</div>
    </div>

    <script>
        const setupScreen = document.getElementById('setup-screen');
        const displayScreen = document.getElementById('display-screen');
        const btnStart = document.getElementById('btn-start');

        const outReason = document.getElementById('out-reason');
        const outTime = document.getElementById('out-time');
        const outCountdown = document.getElementById('out-countdown');
        const outMessage = document.getElementById('out-message');

        let countdownInterval;
        let targetDate;

        // 알림 화면 시작
        btnStart.addEventListener('click', () => {
            const reasonVal = document.getElementById('input-reason').value || '잠시 자리를 비웁니다';
            const timeVal = document.getElementById('input-time').value;
            const messageVal = document.getElementById('input-message').value || '기다려주셔서 감사합니다';

            if (!timeVal) {
                alert('복귀 예정 시간을 입력해주세요!');
                return;
            }

            // UI 텍스트 업데이트
            outReason.textContent = reasonVal;
            outTime.textContent = `Back at ${timeVal}`;
            outMessage.textContent = messageVal;

            // 목표 시간 설정 (오늘 날짜 기준)
            const [hours, minutes] = timeVal.split(':');
            targetDate = new Date();
            targetDate.setHours(parseInt(hours), parseInt(minutes), 0, 0);

            // 만약 목표 시간이 현재 시간보다 이전이면, 다음 날로 설정
            if (targetDate < new Date()) {
                targetDate.setDate(targetDate.getDate() + 1);
            }

            // 카운트다운 시작
            updateCountdown();
            countdownInterval = setInterval(updateCountdown, 1000);

            // 화면 전환
            setupScreen.classList.add('hidden');
            displayScreen.classList.remove('hidden');
        });

        // 카운트다운 로직
        function updateCountdown() {
            const now = new Date();
            const diff = targetDate - now;

            if (diff <= 0) {
                outCountdown.textContent = "00m 00s";
                clearInterval(countdownInterval);
                return;
            }

            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            outCountdown.textContent = `${minutes}m ${seconds}s`;
        }

        // 디스플레이 화면 더블 클릭 시 종료하고 원래 화면으로 복귀
        displayScreen.addEventListener('dblclick', () => {
            clearInterval(countdownInterval);
            displayScreen.classList.add('hidden');
            setupScreen.classList.remove('hidden');
        });
    </script>
</body>
</html>
