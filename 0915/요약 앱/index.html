<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Been - Document Summarizer</title>
    <style>
        /* 애플 스타일의 깔끔한 폰트 스택 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            /* 진한 초록색 그라데이션 테마 (Forest / Emerald Green) */
            --bg-gradient: linear-gradient(135deg, #022c22 0%, #065f46 100%);
            --box-bg: #ffffff;
            --box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary-color: #059669; /* 에메랄드 그린 포인트 */
            --primary-hover: #047857;
            --border-color: #e5e7eb;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* 헤더 영역 */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(2, 44, 34, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
        }

        .header-left {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 0.5px;
        }

        .header-right {
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.8;
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 700px;
            padding: 50px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 타이틀 영역 */
        .title-area {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .title-area h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 10px 0;
            letter-spacing: -0.5px;
        }

        .title-area p {
            margin: 0;
            font-size: 0.95rem;
            opacity: 0.8;
        }

        /* 공통 앱 박스 */
        .app-box {
            width: 100%;
            background: var(--box-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: var(--box-shadow);
        }

        /* ================= 업로드 화면 ================= */
        #upload-screen {
            display: block;
        }

        .dropzone {
            width: 100%;
            padding: 50px 20px;
            border: 2px dashed #9ca3af;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #f9fafb;
        }

        .dropzone:hover, .dropzone.dragover {
            background: #f0fdf4;
            border-color: var(--primary-color);
        }

        .dropzone input[type="file"] {
            display: none;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .dropzone h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .dropzone p {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* ================= 결과 화면 ================= */
        #result-screen {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .result-header h2 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
        }

        .file-badge {
            background: #1e3a8a; /* 원본 이미지의 남색 뱃지 색상 */
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 슬라이더 제어 영역 */
        .slider-section {
            display: flex;
            align-items: center;
            gap: 20px;
            padding-bottom: 30px;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .slider-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-main);
            min-width: 90px;
            line-height: 1.4;
        }

        .slider-label span {
            display: block;
            font-weight: 500;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            background: #e5e7eb;
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #1e3a8a; /* 남색 썸 */
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        /* 요약 문장 리스트 */
        .summary-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .summary-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 10px 0;
        }

        .doc-badge {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            color: #4b5563;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            margin-top: 2px;
        }

        .summary-text {
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #374151;
        }

        /* 리셋 버튼 */
        .btn-reset {
            width: 100%;
            background: transparent;
            color: var(--text-main);
            border: none;
            border-top: 1px solid var(--border-color);
            padding: 20px 0 0 0;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-reset:hover {
            color: var(--primary-hover);
        }

    </style>
</head>
<body>

    <header>
        <div class="header-left">Been</div>
        <div class="header-right">Summarizer</div>
    </header>

    <div class="container">
        <div class="title-area">
            <h1>Document Summarizer</h1>
            <p>Upload your document files and get a quick summary of key points.</p>
        </div>

        <div class="app-box">
            <!-- 1. 업로드 화면 -->
            <div id="upload-screen">
                <div class="dropzone" id="dropzone">
                    <input type="file" id="file-input" accept=".pdf, .docx">
                    <div class="upload-icon">📄</div>
                    <h3>Drag & Drop your files here</h3>
                    <p>Supports PDF and DOCX</p>
                </div>
            </div>

            <!-- 2. 결과 화면 -->
            <div id="result-screen">
                <div class="result-header">
                    <h2>Summary</h2>
                    <div class="file-badge" id="display-filename">파일명.docx</div>
                </div>

                <div class="slider-section">
                    <div class="slider-label">
                        Length: <strong id="val-length">2</strong>
                        <span>sentence(s)</span>
                    </div>
                    <!-- 1문장에서 5문장까지 조절 가능한 슬라이더 -->
                    <input type="range" id="length-slider" min="1" max="5" value="2" step="1">
                </div>

                <div class="summary-list" id="summary-list">
                    <!-- 자바스크립트로 동적 생성되는 요약 문장들 -->
                </div>

                <button class="btn-reset" id="btn-reset">Summarize Another Document</button>
            </div>
        </div>
    </div>

    <script>
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const uploadScreen = document.getElementById('upload-screen');
        const resultScreen = document.getElementById('result-screen');
        const displayFilename = document.getElementById('display-filename');
        const lengthSlider = document.getElementById('length-slider');
        const valLength = document.getElementById('val-length');
        const summaryList = document.getElementById('summary-list');
        const btnReset = document.getElementById('btn-reset');

        // 가상의 TextRank 알고리즘 추출 문장 데이터 (시뮬레이션 용도)
        const dummySentences = [
            "인공지능(AI) 기반 텍스트 분석 알고리즘이 업무 자동화에 미치는 긍정적 영향과 실무 도입 사례를 종합적으로 분석했습니다.",
            "특히 TextRank와 같은 추출 요약 알고리즘을 활용할 경우, 방대한 문서에서 핵심 문장을 빠르게 파악해 검토 시간을 70% 이상 단축할 수 있습니다.",
            "최신 트렌드로는 보안 유출을 방지하기 위해 클라우드 서버 대신 로컬 브라우저 환경에서 경량화 모델을 구동하는 방식이 주목받고 있습니다.",
            "실무자 인터뷰 결과, 요약본의 분량을 상황에 맞게 1~5문장으로 유연하게 조절할 수 있는 기능이 가장 높은 만족도를 보였습니다.",
            "성공적인 AI 도구 도입을 위해서는 알고리즘의 한계를 명확히 인지하고, 최종 결정은 인간의 검수를 거치는 협업 프로세스가 필수적입니다."
        ];

        // 업로드 영역 이벤트
        dropzone.addEventListener('click', () => fileInput.click());
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('dragover');
        });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            if (e.dataTransfer.files.length > 0) {
                processFile(e.dataTransfer.files[0]);
            }
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                processFile(e.target.files[0]);
            }
        });

        // 파일 처리 (화면 전환)
        function processFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext !== 'pdf' && ext !== 'docx') {
                alert('PDF 또는 DOCX 문서 파일만 요약할 수 있습니다.');
                return;
            }

            // 파일명 표시
            displayFilename.textContent = file.name;

            // 기본 2문장으로 렌더링
            lengthSlider.value = 2;
            renderSummary(2);

            // 화면 전환
            uploadScreen.style.display = 'none';
            resultScreen.style.display = 'block';
        }

        // 문장 수 렌더링 로직
        function renderSummary(count) {
            valLength.textContent = count;
            summaryList.innerHTML = ''; // 초기화

            for (let i = 0; i < count; i++) {
                const item = document.createElement('div');
                item.className = 'summary-item';
                item.innerHTML = `
                    <div class="doc-badge">DOC</div>
                    <p class="summary-text">${dummySentences[i]}</p>
                `;
                summaryList.appendChild(item);
            }
        }

        // 슬라이더 이벤트 (1~5 문장 실시간 조절)
        lengthSlider.addEventListener('input', (e) => {
            const count = parseInt(e.target.value);
            renderSummary(count);
        });

        // 다시 하기 버튼
        btnReset.addEventListener('click', () => {
            fileInput.value = '';
            resultScreen.style.display = 'none';
            uploadScreen.style.display = 'block';
        });
    </script>
</body>
</html>
