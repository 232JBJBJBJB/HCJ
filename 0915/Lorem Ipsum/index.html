<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorem Ipsum Generator</title>
    <style>
        /* 애플 스타일의 깔끔한 폰트 스택 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            /* 노란색 그라데이션 테마 (따뜻하고 화사한 앰버/옐로우 톤) */
            --bg-gradient: linear-gradient(135deg, #fefce8 0%, #fef08a 100%);
            --box-bg: rgba(255, 255, 255, 0.9);
            --box-shadow: 0 10px 30px rgba(202, 138, 4, 0.12);
            --text-main: #1d1d1f;
            --text-muted: #713f12;
            --border-color: rgba(250, 204, 21, 0.4);
            --primary-color: #ca8a04;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        /* 메인 컨테이너 */
        .container {
            width: 100%;
            max-width: 680px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 타이틀 영역 */
        .title-area {
            text-align: center;
            margin-bottom: 30px;
        }

        .title-area h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: #422006;
            letter-spacing: -0.5px;
        }

        .title-area p {
            margin: 0;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        /* 제어 패널 (슬라이드 바 영역) */
        .control-panel {
            width: 100%;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px 30px;
            box-shadow: var(--box-shadow);
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .slider-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.95rem;
            font-weight: 600;
            color: #422006;
        }

        .length-display {
            background: #fef08a;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            color: #713f12;
        }

        /* 슬라이더 스타일 */
        input[type="range"] {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 4px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--primary-color);
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        .slider-bounds {
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
            color: #a16207;
        }

        /* 텍스트 출력 박스 */
        .output-box {
            width: 100%;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px 30px;
            box-shadow: var(--box-shadow);
            position: relative;
        }

        .output-header {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 10px;
        }

        /* 복사 버튼 */
        .btn-copy {
            background: #fef08a;
            border: 1px solid #facc15;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #713f12;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-copy:hover {
            background: #fde047;
        }

        .text-content {
            font-size: 0.95rem;
            line-height: 1.7;
            color: #3f3f46;
            max-height: 250px;
            overflow-y: auto;
            word-break: break-all;
            padding-right: 5px;
        }

        /* 스크롤바 디자인 */
        .text-content::-webkit-scrollbar {
            width: 6px;
        }
        .text-content::-webkit-scrollbar-thumb {
            background: #fde047;
            border-radius: 3px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 타이틀 영역 -->
        <div class="title-area">
            <h1>Lorem Ipsum Generator</h1>
            <p>Generate dummy text with style.</p>
        </div>

        <!-- 슬라이더 컨트롤 패널 -->
        <div class="control-panel">
            <div class="slider-header">
                <span>Length</span>
                <span class="length-display" id="length-val">150</span> chars
            </div>
            <input type="range" id="length-slider" min="10" max="5000" value="150" step="10">
            <div class="slider-bounds">
                <span>10 chars</span>
                <span>5000 chars</span>
            </div>
        </div>

        <!-- 텍스트 출력 박스 -->
        <div class="output-box">
            <div class="output-header">
                <button class="btn-copy" id="btn-copy">Copy Text</button>
            </div>
            <div class="text-content" id="text-output">
                <!-- 자바스크립트로 텍스트 동적 생성 -->
            </div>
        </div>
    </div>

    <script>
        const slider = document.getElementById('length-slider');
        const lengthVal = document.getElementById('length-val');
        const textOutput = document.getElementById('text-output');
        const btnCopy = document.getElementById('btn-copy');

        // 기본 Lorem Ipsum 소스 문구
        const sourceText = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum. Sed ut perspiciatis unde omnis iste natus error sit voluptatem accusantium doloremque laudantium, totam rem aperiam, eaque ipsa quae ab illo inventore veritatis et quasi architecto beatae vitae dicta sunt explicabo. Nemo enim ipsam voluptatem quia voluptas sit aspernatur aut odit aut fugit, sed quia consequuntur magni dolores eos qui ratione voluptatem sequi nesciunt. Neque porro quisquam est, qui dolorem ipsum quia dolor sit amet, consectetur, adipisci velit, sed quia non numquam eius modi tempora incidunt ut labore et dolore magnam aliquam quaerat voluptatem. ";

        // 지정된 글자 수(length)만큼 Lorem Ipsum 문장을 반복/잘라내어 생성하는 함수
        function generateLorem(targetLength) {
            let result = "";
            while (result.length < targetLength) {
                result += sourceText;
            }
            return result.substring(0, targetLength);
        }

        // 슬라이더 조작 시 실시간 갱신
        slider.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            lengthVal.textContent = val;
            textOutput.textContent = generateLorem(val);
        });

        // 페이지 최초 로딩 시 기본 150자 생성
        window.addEventListener('DOMContentLoaded', () => {
            textOutput.textContent = generateLorem(150);
        });

        // 클립보드 복사 기능
        btnCopy.addEventListener('click', () => {
            const textToCopy = textOutput.textContent;
            navigator.clipboard.writeText(textToCopy).then(() => {
                btnCopy.textContent = "Copied!";
                setTimeout(() => {
                    btnCopy.textContent = "Copy Text";
                }, 1500);
            });
        });
    </script>
</body>
</html>
