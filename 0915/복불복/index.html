<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Been - Lucky Cannon</title>
    <!-- 물리 엔진 라이브러리 Matter.js 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        /* 애플 스타일 폰트 적용 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        :root {
            /* 노란색 그라데이션 테마 */
            --bg-gradient: linear-gradient(135deg, #fefce8 0%, #fef08a 100%);
            --box-bg: rgba(255, 255, 255, 0.95);
            --box-shadow: 0 10px 40px rgba(202, 138, 4, 0.15);
            --text-main: #1d1d1f;
            --text-muted: #713f12;
            --primary-color: #111827;
            --primary-hover: #374151;
        }

        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg-gradient);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden; /* 캔버스 구동 시 스크롤 방지 */
        }

        /* 헤더 영역 */
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(250, 204, 21, 0.4);
            position: relative;
            z-index: 10;
        }

        .header-left {
            font-weight: 700;
            font-size: 1.2rem;
            color: #854d0e;
        }

        .header-right {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        /* 메인 입력 컨테이너 */
        .container {
            width: 100%;
            max-width: 500px;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 10;
            transition: opacity 0.3s;
        }

        .app-box {
            width: 100%;
            background: var(--box-bg);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: var(--box-shadow);
            border: 1px solid rgba(255, 255, 255, 0.8);
            text-align: center;
        }

        .app-box h1 {
            font-size: 2rem;
            font-weight: 800;
            margin: 0 0 15px 0;
            color: #111827;
            letter-spacing: -0.5px;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            resize: none;
            transition: border-color 0.2s;
            margin-bottom: 20px;
            background: #f9fafb;
        }

        .form-control:focus {
            border-color: #facc15;
            background: #ffffff;
        }

        .btn-start {
            width: 100%;
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-start:hover {
            background: var(--primary-hover);
        }

        /* 물리 엔진 캔버스 컨테이너 */
        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 5;
            pointer-events: none;
            display: none;
        }

        /* 당첨자 발표 화면 */
        #winner-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 20;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none;
            animation: fadeIn 1s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .winner-title {
            font-size: 1.5rem;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        .winner-name {
            font-size: 5rem;
            font-weight: 800;
            color: #4ade80; /* 형광 초록색 */
            margin: 0 0 30px 0;
            text-shadow: 0 0 20px rgba(74, 222, 128, 0.5);
        }

        .btn-restart {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #94a3b8;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-restart:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">Been</div>
        <div class="header-right">Lucky Cannon</div>
    </header>

    <div class="container" id="input-screen">
        <div class="app-box">
            <h1>Lucky Cannon</h1>
            <textarea id="names-input" class="form-control" rows="4" placeholder="참가자 이름을 쉼표(,)로 구분해서 입력해주세요.&#13;&#10;예: 앨리스, 밥, 찰리"></textarea>
            <button class="btn-start" id="btn-start">START</button>
        </div>
    </div>

    <!-- 물리 엔진 시뮬레이션 화면 -->
    <div id="canvas-container"></div>

    <!-- 당첨자 발표 화면 -->
    <div id="winner-screen">
        <div class="winner-title">The Winner is</div>
        <div class="winner-name" id="winner-name">렌</div>
        <button class="btn-restart" onclick="location.reload()">다시 하기</button>
    </div>

    <script>
        const btnStart = document.getElementById('btn-start');
        const inputScreen = document.getElementById('input-screen');
        const canvasContainer = document.getElementById('canvas-container');
        const winnerScreen = document.getElementById('winner-screen');
        const winnerNameEl = document.getElementById('winner-name');

        btnStart.addEventListener('click', () => {
            const inputVal = document.getElementById('names-input').value;
            const names = inputVal.split(',').map(n => n.trim()).filter(n => n);

            if (names.length < 2) {
                alert('추첨을 위해 최소 2명 이상의 이름을 입력해주세요!');
                return;
            }

            // 입력창 숨기고 캔버스 표시
            inputScreen.style.opacity = '0';
            setTimeout(() => {
                inputScreen.style.display = 'none';
                canvasContainer.style.display = 'block';
                startPhysics(names);
            }, 300);
        });

        function startPhysics(names) {
            // Matter.js 모듈
            const Engine = Matter.Engine,
                  Render = Matter.Render,
                  Runner = Matter.Runner,
                  Bodies = Matter.Bodies,
                  Composite = Matter.Composite,
                  Events = Matter.Events,
                  Body = Matter.Body;

            const engine = Engine.create();
            
            // 렌더러 생성 (배경 투명하게 설정)
            const render = Render.create({
                element: canvasContainer,
                engine: engine,
                options: {
                    width: window.innerWidth,
                    height: window.innerHeight,
                    wireframes: false,
                    background: 'transparent'
                }
            });

            // 화면 경계 (천장, 좌, 우 벽) 생성
            const wallOptions = { isStatic: true, render: { fillStyle: 'transparent' } };
            Composite.add(engine.world, [
                Bodies.rectangle(window.innerWidth / 2, -100, window.innerWidth, 50, wallOptions), // 천장
                Bodies.rectangle(-25, window.innerHeight / 2, 50, window.innerHeight * 2, wallOptions), // 좌측 벽
                Bodies.rectangle(window.innerWidth + 25, window.innerHeight / 2, 50, window.innerHeight * 2, wallOptions) // 우측 벽
            ]);

            // 중앙 장애물(핀) 생성
            const pegs = [];
            const rows = 6;
            const cols = Math.floor(window.innerWidth / 80);
            const spacingX = window.innerWidth / cols;
            const spacingY = (window.innerHeight * 0.45) / rows;
            const startY = window.innerHeight * 0.2; // 위에서부터 20% 지점에서 시작

            for (let i = 0; i < rows; i++) {
                for (let j = 0; j < cols + 1; j++) {
                    let x = j * spacingX;
                    if (i % 2 === 1) x += spacingX / 2; // 지그재그 배치
                    pegs.push(Bodies.circle(x, startY + i * spacingY, 8, { 
                        isStatic: true, 
                        render: { fillStyle: 'rgba(0, 0, 0, 0.15)' } 
                    }));
                }
            }
            Composite.add(engine.world, pegs);

            // 구슬 생성
            const balls = [];
            const colors = ['#ef4444', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4'];

            names.forEach((name, idx) => {
                const ball = Bodies.circle(window.innerWidth / 2 + (Math.random() * 20 - 10), window.innerHeight - 30, 20, {
                    restitution: 0.9, // 탄성력 (잘 튀어오름)
                    friction: 0.005,
                    render: { fillStyle: colors[idx % colors.length] },
                    label: name,
                    isFinished: false
                });
                balls.push(ball);
            });
            Composite.add(engine.world, balls);

            // 구슬 대포 발사! (위로 강하게 쏘아 올림)
            balls.forEach(ball => {
                Body.setVelocity(ball, { 
                    x: (Math.random() - 0.5) * 20, // 좌우로 무작위 퍼짐
                    y: -30 - Math.random() * 15   // 위로 강력하게 발사
                });
            });

            // 구슬 중앙에 이름 그리기 (Canvas API 확장)
            Events.on(render, 'afterRender', function() {
                const ctx = render.context;
                ctx.font = "bold 13px Pretendard, sans-serif";
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";

                balls.forEach(ball => {
                    if (ball.position.y < window.innerHeight + 100) {
                        ctx.fillText(ball.label, ball.position.x, ball.position.y);
                    }
                });
            });

            // 구슬이 걸리지 않도록 미세한 진동 추가 및 바닥 통과 체크
            let finishedCount = 0;
            let lastWinner = null;
            let isGameOver = false;

            Events.on(engine, 'beforeUpdate', function() {
                if (isGameOver) return;

                balls.forEach(ball => {
                    // 미세 진동 부여 (장애물에 끼임 방지)
                    if (ball.speed < 0.2 && ball.position.y < window.innerHeight) {
                        Body.applyForce(ball, ball.position, { x: (Math.random() - 0.5) * 0.005, y: 0 });
                    }

                    // 화면 밑으로 떨어지면 카운트
                    if (!ball.isFinished && ball.position.y > window.innerHeight + 50) {
                        ball.isFinished = true;
                        finishedCount++;
                        lastWinner = ball.label; // 가장 마지막에 떨어진 사람 기록

                        // 모든 구슬이 다 떨어졌을 때
                        if (finishedCount === balls.length) {
                            isGameOver = true;
                            setTimeout(() => {
                                winnerNameEl.textContent = lastWinner;
                                winnerScreen.style.display = 'flex';
                            }, 500);
                        }
                    }
                });
            });

            // 물리 엔진 실행
            Render.run(render);
            const runner = Runner.create();
            Runner.run(runner, engine);
        }
    </script>
</body>
</html>
