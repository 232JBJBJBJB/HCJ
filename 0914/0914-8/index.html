<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jing - Video to GIF</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap');

        :root {
            /* 연한 초록색 그라데이션 및 디자인 테마 */
            --bg-base: #e8f5e9;
            --bg-glow: #c8e6c9;
            --text-color: #1b5e20;
            --text-muted: #4e342e;
            --box-bg: rgba(255, 255, 255, 0.85);
            --border-color: #a5d6a7;
            --dropzone-bg: rgba(255, 255, 255, 0.6);
            --btn-bg: #2e7d32;
            --btn-hover: #1b5e20;
            --x: 50%;
            --y: 50%;
        }

        * {
            box-sizing: border-box;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Gowun Dodum', sans-serif;
            color: var(--text-color);
            min-height: 100vh;
            background: radial-gradient(circle at var(--x) var(--y), var(--bg-glow) 0%, var(--bg-base) 70%);
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: inherit;
        }

        .header-left img {
            height: 35px;
            border-radius: 6px;
        }

        .header-left h1 {
            font-size: 1.2rem;
            margin: 0;
            font-weight: bold;
        }

        .header-right {
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--text-muted);
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            max-width: 700px;
            margin: 0 auto;
            width: 100%;
        }

        .title-area {
            text-align: center;
            margin-bottom: 40px;
        }

        .title-area h2 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            color: var(--btn-bg);
        }

        .title-area p {
            margin: 5px 0;
            font-size: 1rem;
        }

        .sub-desc {
            font-size: 0.85rem;
            color: #558b2f;
        }

        /* 드롭존 영역 */
        .dropzone {
            width: 100%;
            padding: 40px 20px;
            border: 2px dashed var(--border-color);
            border-radius: 15px;
            background: var(--box-bg);
            text-align: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            margin-bottom: 30px;
        }

        .dropzone:hover {
            border-color: var(--btn-bg);
            background: #ffffff;
        }

        .dropzone input[type="file"] {
            display: none;
        }

        .dropzone-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .dropzone h3 {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: #333;
        }

        .dropzone p {
            margin: 0 0 15px 0;
            font-size: 0.85rem;
            color: #666;
        }

        .btn-select {
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
            font-family: inherit;
        }

        .btn-select:hover {
            background: var(--btn-hover);
        }

        /* 파일 목록 영역 */
        .queue-area {
            width: 100%;
            display: none;
        }

        .file-item {
            display: flex;
            align-items: center;
            background: var(--box-bg);
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            gap: 15px;
        }

        .file-thumb {
            width: 60px;
            height: 60px;
            background: #ddd;
            border-radius: 8px;
            object-fit: cover;
        }

        .file-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .file-name {
            font-size: 0.9rem;
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }

        .progress-bar-bg {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--btn-bg);
            width: 0%;
            transition: width 0.2s;
        }

        .download-btn {
            background: var(--btn-bg);
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            display: none;
            text-decoration: none;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .download-btn:hover { background: var(--btn-hover); }

    </style>
</head>
<body>

    <header>
        <a href="https://nanalab.kr" class="header-left" target="_blank">
            <img src="logo_jing.svg.png" alt="Jing 로고" onerror="this.src='https://via.placeholder.com/120x35/2e7d32/ffffff?text=JING'">
            <h1>Jing</h1>
        </a>
        <div class="header-right">
            Video to GIF
        </div>
    </header>

    <main>
        <div class="title-area">
            <h2>Video → GIF</h2>
            <p>Make your own GIF Animation!</p>
            <p class="sub-desc">This service runs on your browser. No data is sent to the server. Super Safe!</p>
        </div>

        <!-- 드롭존 영역 -->
        <div class="dropzone" id="dropzone">
            <input type="file" id="file-input" accept="video/mp4,video/webm,video/quicktime">
            <div class="dropzone-icon">📁</div>
            <h3>Drag and drop your video here</h3>
            <p>or</p>
            <button class="btn-select">Choose File</button>
        </div>

        <!-- 처리 목록 영역 -->
        <div class="queue-area" id="queue-area">
            <div id="file-list"></div>
        </div>
    </main>

    <script>
        // 마우스 그라데이션 인터랙션
        document.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            document.documentElement.style.setProperty('--x', `${x}%`);
            document.documentElement.style.setProperty('--y', `${y}%`);
        });

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const queueArea = document.getElementById('queue-area');
        const fileList = document.getElementById('file-list');

        dropzone.addEventListener('click', () => fileInput.click());
        
        dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.style.borderColor = '#2e7d32'; });
        dropzone.addEventListener('dragleave', () => { dropzone.style.borderColor = '#a5d6a7'; });
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.style.borderColor = '#a5d6a7';
            if (e.dataTransfer.files.length > 0) {
                handleVideo(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleVideo(e.target.files[0]);
            }
            fileInput.value = '';
        });

        function handleVideo(file) {
            if (!file.type.startsWith('video/')) {
                alert('동영상 파일만 업로드할 수 있습니다.');
                return;
            }

            queueArea.style.display = 'block';
            const fileId = 'vid-' + Math.random().toString(36).substr(2, 9);
            const thumbUrl = URL.createObjectURL(file);

            const fileItem = document.createElement('div');
            fileItem.className = 'file-item';
            fileItem.innerHTML = `
                <video src="${thumbUrl}" class="file-thumb" muted></video>
                <div class="file-info">
                    <div class="file-name">${file.name}</div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="prog-${fileId}"></div>
                    </div>
                </div>
                <a href="#" class="download-btn" id="btn-${fileId}">Download GIF</a>
            `;
            fileList.prepend(fileItem);

            simulateConversion(fileId, file.name);
        }

        function simulateConversion(fileId, fileName) {
            const progressBar = document.getElementById(`prog-${fileId}`);
            const downloadBtn = document.getElementById(`btn-${fileId}`);
            let progress = 0;

            const interval = setInterval(() => {
                // 29FPS 제한 및 부드러운 렌더링 연출
                progress += Math.floor(Math.random() * 12) + 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    
                    downloadBtn.style.display = 'block';
                    downloadBtn.onclick = (e) => {
                        e.preventDefault();
                        alert(`[완료] ${fileName.replace(/\.[^/.]+$/, "")}.gif 파일이 성공적으로 다운로드되었습니다.`);
                    };
                }
                progressBar.style.width = progress + '%';
            }, 140);
        }
    </script>
</body>
</html>
